name: Android APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Web-Assets in das Android-Projekt synchronisieren
        run: |
          # Nur Produktionsabhängigkeiten (Capacitor) – die Test-Dev-Abhängigkeit
          # Playwright wird hier nicht gebraucht und würde sonst einen Browser laden.
          npm ci --omit=dev
          # Build-Identität in die APK einbacken – die In-App-Updateprüfung
          # vergleicht diesen Commit mit dem des "latest"-Releases.
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/version.json
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Debug-APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../pomodoro.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-apk
          path: pomodoro.apk

      - name: Build-Metadaten für den Release ermitteln
        if: github.ref == 'refs/heads/main'
        id: meta
        run: |
          echo "date=$(date -u '+%d.%m.%Y %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      # Name und Beschreibung werden bei jedem Build mit Datum und Commit
      # aktualisiert, damit sofort erkennbar ist, wie aktuell die APK ist.
      # Kein Pre-Release, damit GitHub den Build als „Latest“ hervorhebt.
      - name: APK im "latest"-Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pomodoro – Build vom ${{ steps.meta.outputs.date }}
          body: |
            Automatisch gebaute Debug-APK. Auf dem Android-Smartphone herunterladen,
            öffnen und installieren („Unbekannte Quellen“ einmalig erlauben).

            **Build:** ${{ steps.meta.outputs.date }}
            **Commit:** [`${{ steps.meta.outputs.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) – ${{ steps.meta.outputs.subject }}
          prerelease: false
          files: pomodoro.apk
